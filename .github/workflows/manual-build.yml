name: Manual Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean workspace
        run: rm -rf ..?* .[!.]* *

      - name: Checkout official v2rayNG repository
        uses: actions/checkout@v4
        with:
          repository: '2dust/v2rayNG'
          path: '.'
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Скачиваем готовый предсобранный libv2ray.aar из официального репозитория ядра
      - name: Download prebuilt libv2ray core
        run: |
          mkdir -p V2rayNG/app/libs
          echo "Загрузка готового ядра libv2ray.aar..."
          
          # Получаем последний релизный AAR напрямую из официального репозитория AndroidLibXrayLite
          AAR_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*\.aar" | cut -d '"' -f 4 | head -n 1)
          
          if [ -z "$AAR_URL" ]; then
            # Запасная прямая ссылка, если GitHub API отдаст лимит запросов
            AAR_URL="https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi
          
          echo "Скачивание из: $AAR_URL"
          curl -L -o V2rayNG/app/libs/libv2ray.aar "$AAR_URL"
          
          # Проверяем, что файл действительно скачался и имеет размер больше 5 МБ
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Grant execute permission for gradlew
        working-directory: V2rayNG
        run: chmod +x gradlew

      # Собираем F-Droid Debug вариант
      - name: Build Debug APK
        working-directory: V2rayNG
        run: ./gradlew assembleFdroidDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          retention-days: 7
