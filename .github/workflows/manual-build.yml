name: Manual Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Скачиваем оригинальный проект v2rayNG со всеми файлами
      - name: Clone official v2rayNG source code
        run: |
          git clone --recurse-submodules https://github.com/2dust/v2rayNG.git src_project
          # Перемещаем всё содержимое в текущую рабочую директорию
          shopt -s dotglob
          mv src_project/* .
          rm -rf src_project
          
          echo "=== Проверка наличия файлов проекта ==="
          ls -la

      # Даем права на встроенный gradlew из репозитория v2rayNG
      - name: Prepare gradlew
        run: |
          chmod +x gradlew

      # Собираем APK
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Выгружаем полученный APK в артефакты
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
