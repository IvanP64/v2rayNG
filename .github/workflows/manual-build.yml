- name: Checkout upstream v2rayNG
        run: |
          # Клонируем во временную папку и переносим содержимое, чтобы избежать конфликтов
          git clone --recurse-submodules https://github.com/2dust/v2rayNG.git temp_repo
          cp -r temp_repo/. .
          rm -rf temp_repo
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew не найден, генерируем..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew
          ls -l gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace
