name: Manual Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Проверка содержимого папки и восстановление gradlew при необходимости
      - name: Ensure gradlew exists and make executable
        run: |
          echo "Current directory contents:"
          ls -la
          
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper using gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
