name: Manual Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Клонируем официальный репозиторий v2rayNG со всеми сабмодулями
      - name: Clone upstream v2rayNG
        run: |
          git clone --recurse-submodules https://github.com/2dust/v2rayNG.git .
          echo "Содержимое папки после клонирования:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Проверяем права на запуск родного gradlew из репозитория
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Собираем APK
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Сохраняем готовый APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
